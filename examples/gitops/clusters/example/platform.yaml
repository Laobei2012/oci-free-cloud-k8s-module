# Applies the Flux Kustomization of each shared app. Each app Kustomization
# then applies its own folder from the GitRepository "platform".
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform
  namespace: flux-system
spec:
  interval: 1h
  path: ./gitops/platform
  prune: true
  sourceRef:
    kind: GitRepository
    name: platform
