apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  interval: 1h
  timeout: 10m
  path: ./gitops/infrastructure/envoy-gateway/
  prune: true
  sourceRef:
    kind: GitRepository
    name: platform
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: envoy-gateway
      namespace: envoy-gateway
