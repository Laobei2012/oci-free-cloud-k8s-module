apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    # The source moves to the public module repo. Without this annotation,
    # flux-system prunes this Kustomization during the move, and Flux then
    # deletes its apps. Remove it after the move.
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: cert-manager-issuer
  namespace: flux-system
spec:
  dependsOn:
    - name: cert-manager
    - name: external-secrets
  interval: 5m
  path: "./gitops/infrastructure/cert-manager/issuer"
  prune: true
  sourceRef:
    kind: GitRepository
    name: platform
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
