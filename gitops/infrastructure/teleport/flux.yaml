apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    # The source moves to the public module repo. Without this annotation,
    # flux-system prunes this Kustomization during the move, and Flux then
    # deletes its apps. Remove it after the move.
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: teleport
  namespace: flux-system
spec:
  interval: 1h
  path: ./gitops/infrastructure/teleport
  prune: true
  dependsOn:
    - name: external-dns
    - name: cert-manager
    - name: longhorn
  sourceRef:
    kind: GitRepository
    name: platform
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    # The source moves to the public module repo. Without this annotation,
    # flux-system prunes this Kustomization during the move, and Flux then
    # deletes its apps. Remove it after the move.
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: teleport-rbac
  namespace: flux-system
spec:
  interval: 1h
  path: ./gitops/infrastructure/teleport/rbac/
  prune: true
  dependsOn:
    - name: teleport
  sourceRef:
    kind: GitRepository
    name: platform
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
