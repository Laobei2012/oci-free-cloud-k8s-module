apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: teleport
  namespace: flux-system
spec:
  interval: 1h
  path: ./gitops/infrastructure/teleport
  prune: true
  dependsOn:
    - name: external-dns
    - name: cert-manager
    - name: longhorn
  sourceRef:
    kind: GitRepository
    name: platform
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: teleport-rbac
  namespace: flux-system
spec:
  interval: 1h
  path: ./gitops/infrastructure/teleport/rbac/
  prune: true
  dependsOn:
    - name: teleport
  sourceRef:
    kind: GitRepository
    name: platform
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
