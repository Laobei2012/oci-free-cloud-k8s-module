apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kubelet-csr-approver
spec:
  interval: 5m
  url: https://postfinance.github.io/kubelet-csr-approver
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubelet-csr-approver
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: kubelet-csr-approver
      version: "1.2.15"
      sourceRef:
        kind: HelmRepository
        name: kubelet-csr-approver
      interval: 5m
  releaseName: kubelet-csr-approver
  values:
    # approves the kubelet serving certificates of the account B nodes, see
    # terraform/modules/account-b. the node names are their private IPs in 10.1.1.0/24.
    # the approver does not compare the IP in a request with the IP of the
    # node, so a B node can get a certificate for the IP of another B node
    providerRegex: '^10\.1\.1\.\d{1,3}$'
    providerIpPrefixes:
      - 10.1.1.0/24
    # the requests contain no DNS names
    bypassDnsResolution: true
    # requests that do not match stay pending for a manual decision
    skipDenyStep: true
    replicas: 1
