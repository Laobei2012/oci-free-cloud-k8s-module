apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 1h
  timeout: 10m
  path: ./gitops/infrastructure/external-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: platform
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: external-secrets
      namespace: external-secrets
