apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 5m
  url: https://charts.external-secrets.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 10m
  timeout: 5m
  targetNamespace: external-secrets
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: external-secrets
      version: '2.13.0'
      sourceRef:
        kind: HelmRepository
        name: external-secrets
      interval: 5m
  releaseName: external-secrets
  values:
    # The chart has no metrics service by default. The release label lets
    # kube-prometheus-stack find the monitor.
    metrics:
      service:
        enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
