apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: snapshot-controller
  namespace: flux-system
spec:
  interval: 1h
  timeout: 10m
  path: ./gitops/infrastructure/snapshot-controller
  prune: true
  sourceRef:
    kind: GitRepository
    name: platform
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: snapshot-controller
      namespace: snapshot-controller
