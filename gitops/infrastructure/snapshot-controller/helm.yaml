apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: piraeus
spec:
  interval: 5m
  url: https://piraeus.io/helm-charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: snapshot-controller
      version: "5.4.0"
      sourceRef:
        kind: HelmRepository
        name: piraeus
      interval: 5m
  releaseName: snapshot-controller
  # the chart installs the snapshot.storage.k8s.io CRDs and the controller.
  # OKE does not provide them. the Longhorn csi-snapshotter needs them.
  # the CRDs are templates in this chart, so a chart upgrade also updates them
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    controller:
      resources:
        requests:
          memory: 64Mi
        limits:
          memory: 128Mi
    installCRDs: true
    # Helm maps every object of a release before it creates the CRDs, so a
    # VolumeSnapshotClass in this release fails on a new cluster. the class
    # is in ./class, which Flux applies after this release is healthy
