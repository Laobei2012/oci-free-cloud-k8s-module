apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: snapshot-controller-class
  namespace: flux-system
spec:
  dependsOn:
    - name: snapshot-controller
  interval: 1h
  path: ./gitops/infrastructure/snapshot-controller/class
  prune: true
  sourceRef:
    kind: GitRepository
    name: platform
