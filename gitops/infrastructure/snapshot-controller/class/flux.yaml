apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    # The source moves to the public module repo. Without this annotation,
    # flux-system prunes this Kustomization during the move, and Flux then
    # deletes its apps. Remove it after the move.
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: snapshot-controller-class
  namespace: flux-system
spec:
  dependsOn:
    - name: snapshot-controller
  interval: 1h
  path: ./gitops/infrastructure/snapshot-controller/class
  prune: true
  sourceRef:
    kind: GitRepository
    name: platform
