apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: longhorn
spec:
  interval: 5m
  url: https://charts.longhorn.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: longhorn
      version: '1.13.0'
      sourceRef:
        kind: HelmRepository
        name: longhorn
      interval: 5m
  releaseName: longhorn
  # the chart has no value for allowedTopologies. Longhorn creates the
  # StorageClass longhorn from this ConfigMap again when the content changes.
  # pods that use a volume of this class run only in the zones of account A.
  # keep numberOfReplicas equal to persistence.defaultClassReplicaCount
  postRenderers:
    - kustomize:
        patches:
          # the chart has no resource values for the UI, the driver deployer
          # and the manager pre-pull container
          - target:
              kind: Deployment
              name: longhorn-ui
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: longhorn-ui
              spec:
                template:
                  spec:
                    containers:
                      - name: longhorn-ui
                        resources:
                          requests:
                            memory: 32Mi
                          limits:
                            memory: 64Mi
          - target:
              kind: Deployment
              name: longhorn-driver-deployer
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: longhorn-driver-deployer
              spec:
                template:
                  spec:
                    initContainers:
                      - name: wait-longhorn-manager
                        resources:
                          requests:
                            memory: 32Mi
                          limits:
                            memory: 64Mi
                    containers:
                      - name: longhorn-driver-deployer
                        resources:
                          requests:
                            memory: 32Mi
                          limits:
                            memory: 64Mi
          - target:
              kind: DaemonSet
              name: longhorn-manager
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: longhorn-manager
              spec:
                template:
                  spec:
                    containers:
                      - name: pre-pull-share-manager-image
                        resources:
                          requests:
                            memory: 16Mi
                          limits:
                            memory: 32Mi
          - target:
              kind: ConfigMap
              name: longhorn-storageclass
            patch: |
              - op: replace
                path: /data/storageclass.yaml
                value: |
                  kind: StorageClass
                  apiVersion: storage.k8s.io/v1
                  metadata:
                    name: longhorn
                    annotations:
                      storageclass.kubernetes.io/is-default-class: "true"
                  provisioner: driver.longhorn.io
                  allowVolumeExpansion: true
                  reclaimPolicy: "Delete"
                  volumeBindingMode: Immediate
                  mountOptions:
                    - discard
                  parameters:
                    numberOfReplicas: "2"
                    staleReplicaTimeout: "30"
                    fromBackup: ""
                    fsType: "ext4"
                    dataLocality: "disabled"
                    unmapMarkSnapChainRemoved: "ignored"
                    disableRevisionCounter: "true"
                    dataEngine: "v1"
                    backupTargetName: "default"
                  allowedTopologies:
                    - matchLabelExpressions:
                        - key: topology.kubernetes.io/zone
                          values:
                            - ${oci_zone_prefix_a}-AD-1
                            - ${oci_zone_prefix_a}-AD-2
                            - ${oci_zone_prefix_a}-AD-3
  values:
    global:
      imageRegistry: docker.io
    defaultSettings:
      # volumes without a node selector cannot use nodes with a Longhorn tag.
      # the account B nodes get the tag pool-b, the OKE nodes have no tag
      allowEmptyNodeSelectorVolume: false
      storageMinimalAvailablePercentage: 10
      # only nodes with node.longhorn.io/create-default-disk=true get a disk.
      # the OKE node pool sets this label. the account B nodes do not have it,
      # because synchronous replicas across regions are too slow
      createDefaultDiskLabeledNodes: true
      # Longhorn writes the zones of allowedTopologies into the node affinity
      # of new PVs. Longhorn CSI does not report the region, only the zone
      csiAllowedTopologyKeys: topology.kubernetes.io/zone
      # a trim always frees space in the snapshots that Longhorn marked as
      # removed. with true, a trim also marks manual snapshots as removed.
      # false must stay here, because Longhorn keeps the last value of a
      # setting that the chart no longer sets
      removeSnapshotsDuringFilesystemTrim: false
      # after a Longhorn upgrade, Longhorn moves the volumes to the new engine
      # live, one volume per node at a time
      concurrentAutomaticEngineUpgradePerNodeLimit: 1
      # the setting takes both requests and limits, keyed by component
      systemManagedCSIComponentsResourceLimits: |
        {
          "csi-attacher": {"requests": {"memory": "64Mi"}, "limits": {"memory": "128Mi"}},
          "csi-provisioner": {"requests": {"memory": "64Mi"}, "limits": {"memory": "128Mi"}},
          "csi-resizer": {"requests": {"memory": "64Mi"}, "limits": {"memory": "128Mi"}},
          "csi-snapshotter": {"requests": {"memory": "64Mi"}, "limits": {"memory": "128Mi"}},
          "longhorn-csi-plugin": {"requests": {"memory": "64Mi"}, "limits": {"memory": "128Mi"}},
          "node-driver-registrar": {"requests": {"memory": "32Mi"}, "limits": {"memory": "64Mi"}},
          "longhorn-liveness-probe": {"requests": {"memory": "32Mi"}, "limits": {"memory": "64Mi"}}
        }
    longhornManager:
      resources:
        requests:
          memory: 384Mi
        limits:
          memory: 768Mi
    longhornGlobalManager:
      resources:
        requests:
          memory: 64Mi
        limits:
          memory: 128Mi
    persistence:
      defaultClassReplicaCount: 2
    ingress:
      enabled: false
    # The release label lets kube-prometheus-stack find the monitor.
    metrics:
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack
