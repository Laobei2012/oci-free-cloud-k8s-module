apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: longhorn
spec:
  interval: 5m
  url: https://charts.longhorn.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: longhorn
      version: '1.12.1'
      sourceRef:
        kind: HelmRepository
        name: longhorn
      interval: 5m
  releaseName: longhorn
  # the chart has no value for allowedTopologies. Longhorn creates the
  # StorageClass longhorn from this ConfigMap again when the content changes.
  # pods that use a volume of this class run only in the zones of account A.
  # keep numberOfReplicas equal to persistence.defaultClassReplicaCount
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ConfigMap
              name: longhorn-storageclass
            patch: |
              - op: replace
                path: /data/storageclass.yaml
                value: |
                  kind: StorageClass
                  apiVersion: storage.k8s.io/v1
                  metadata:
                    name: longhorn
                    annotations:
                      storageclass.kubernetes.io/is-default-class: "true"
                  provisioner: driver.longhorn.io
                  allowVolumeExpansion: true
                  reclaimPolicy: "Delete"
                  volumeBindingMode: Immediate
                  mountOptions:
                    - discard
                  parameters:
                    numberOfReplicas: "2"
                    staleReplicaTimeout: "30"
                    fromBackup: ""
                    fsType: "ext4"
                    dataLocality: "disabled"
                    unmapMarkSnapChainRemoved: "ignored"
                    disableRevisionCounter: "true"
                    dataEngine: "v1"
                    backupTargetName: "default"
                  allowedTopologies:
                    - matchLabelExpressions:
                        - key: topology.kubernetes.io/zone
                          values:
                            - ${oci_zone_prefix_a}-AD-1
                            - ${oci_zone_prefix_a}-AD-2
                            - ${oci_zone_prefix_a}-AD-3
  values:
    global:
      imageRegistry: docker.io
    defaultSettings:
      # volumes without a node selector cannot use nodes with a Longhorn tag.
      # the account B nodes get the tag pool-b, the OKE nodes have no tag
      allowEmptyNodeSelectorVolume: false
      storageMinimalAvailablePercentage: 10
      # only nodes with node.longhorn.io/create-default-disk=true get a disk.
      # the OKE node pool sets this label. the account B nodes do not have it,
      # because synchronous replicas across regions are too slow
      createDefaultDiskLabeledNodes: true
      # Longhorn writes the zones of allowedTopologies into the node affinity
      # of new PVs. Longhorn CSI does not report the region, only the zone
      csiAllowedTopologyKeys: topology.kubernetes.io/zone
      # a trim always frees space in the snapshots that Longhorn marked as
      # removed. with true, a trim also marks manual snapshots as removed.
      # false must stay here, because Longhorn keeps the last value of a
      # setting that the chart no longer sets
      removeSnapshotsDuringFilesystemTrim: false
    persistence:
      defaultClassReplicaCount: 2
    ingress:
      enabled: false
    # The release label lets kube-prometheus-stack find the monitor.
    metrics:
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack
