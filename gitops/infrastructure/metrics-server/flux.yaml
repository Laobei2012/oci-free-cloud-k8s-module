apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metrics-server
  namespace: flux-system
spec:
  interval: 1h
  timeout: 10m
  path: ./gitops/infrastructure/metrics-server
  prune: true
  sourceRef:
    kind: GitRepository
    name: platform
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: metrics-server
      namespace: metrics-server
