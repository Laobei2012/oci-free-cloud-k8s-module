apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-addons
  namespace: flux-system
spec:
  interval: 1h
  path: ./gitops/infrastructure/fluxcd-addons
  prune: true
  dependsOn:
    - name: external-secrets
    - name: envoy-gateway
    - name: prometheus-operator-crds
  sourceRef:
    kind: GitRepository
    name: platform
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
