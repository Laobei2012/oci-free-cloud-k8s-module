apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  annotations:
    # The source moves to the public module repo. Without this annotation,
    # flux-system prunes this Kustomization during the move, and Flux then
    # deletes its apps. Remove it after the move.
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: jenkins
  namespace: flux-system
spec:
  interval: 1h
  path: ./gitops/tools/jenkins
  prune: true
  dependsOn:
    - name: external-secrets
    - name: envoy-gateway
    - name: longhorn
  sourceRef:
    kind: GitRepository
    name: platform
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
