apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: gha-runners
spec:
  type: oci
  interval: 1h
  url: oci://ghcr.io/actions/actions-runner-controller-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gha-runners
spec:
  interval: 10m
  timeout: 10m
  chart:
    spec:
      chart: gha-runner-scale-set
      version: '0.15.1'
      sourceRef:
        kind: HelmRepository
        name: gha-runners
  releaseName: gha-runners
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    githubConfigUrl: ${gha_github_config_url}
  valuesFrom:
    - kind: ConfigMap
      name: gha-runner-values
      valuesKey: values.yaml
