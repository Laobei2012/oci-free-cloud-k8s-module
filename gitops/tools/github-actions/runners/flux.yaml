apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gha-runners
  namespace: flux-system
spec:
  interval: 1h
  timeout: 10m
  path: ./gitops/tools/github-actions/runners
  prune: true
  dependsOn:
    - name: gha-controller
    - name: external-secrets
  sourceRef:
    kind: GitRepository
    name: platform
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: gha-github
      namespace: arc-runners
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: gha-runners
      namespace: arc-runners
