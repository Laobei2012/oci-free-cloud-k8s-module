githubConfigSecret: gha-github
runnerScaleSetName: oci-arm64
minRunners: 0
maxRunners: 2
controllerServiceAccount:
  namespace: arc-systems
  name: gha-controller
listenerTemplate:
  spec:
    containers:
      - name: listener
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 128Mi
template:
  spec:
    automountServiceAccountToken: false
    nodeSelector:
      kubernetes.io/arch: arm64
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:2.338.2
        command: ["/home/runner/run.sh"]
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
            ephemeral-storage: 1Gi
          limits:
            cpu: '1'
            memory: 2Gi
            ephemeral-storage: 8Gi
