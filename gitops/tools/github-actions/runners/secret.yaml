apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gha-github
spec:
  refreshInterval: 3m
  secretStoreRef:
    kind: ClusterSecretStore
    name: oracle-vault
  target:
    name: gha-github
    creationPolicy: Owner
  data:
    - secretKey: github_token
      remoteRef:
        key: ${gha_github_token_secret:=gha-github-token}
        version: CURRENT
