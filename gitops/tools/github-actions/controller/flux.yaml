apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gha-controller
  namespace: flux-system
spec:
  interval: 1h
  timeout: 10m
  path: ./gitops/tools/github-actions/controller
  prune: true
  sourceRef:
    kind: GitRepository
    name: platform
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: gha-controller
      namespace: arc-systems
