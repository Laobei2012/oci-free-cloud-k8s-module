apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: gha-controller
spec:
  type: oci
  interval: 1h
  url: oci://ghcr.io/actions/actions-runner-controller-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gha-controller
spec:
  interval: 10m
  timeout: 10m
  chart:
    spec:
      chart: gha-runner-scale-set-controller
      version: '0.15.1'
      sourceRef:
        kind: HelmRepository
        name: gha-controller
  releaseName: gha-controller
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    serviceAccount:
      name: gha-controller
    flags:
      logLevel: info
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi
