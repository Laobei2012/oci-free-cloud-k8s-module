apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
spec:
  interval: 5m
  url: https://grafana.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: loki
      version: '7.3.0'
      sourceRef:
        kind: HelmRepository
        name: grafana
      interval: 5m
  releaseName: loki
  values:
    # one pod runs all Loki components. the chunks and the index stay on a
    # Longhorn volume, not in object storage
    deploymentMode: SingleBinary
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2026-10-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      # the compactor deletes chunks that are older than retention_period
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
      limits_config:
        retention_period: 336h
        allow_structured_metadata: true
        volume_enabled: true
    singleBinary:
      replicas: 1
      # the account B nodes have the most free memory and an empty Longhorn
      # pool. pods with a longhorn-account-b volume run only in its zones
      nodeSelector:
        tenancy: account-b
      persistence:
        enabled: true
        size: 20Gi
        storageClass: longhorn-account-b
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1536Mi
    # Grafana sends queries to the loki Service on port 3100. a single binary
    # needs no nginx gateway
    gateway:
      enabled: false
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    # the memcached caches request several GB of memory
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false
