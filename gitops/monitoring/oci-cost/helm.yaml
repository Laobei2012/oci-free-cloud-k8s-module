# oci-cost-collector loads the new cost reports of one account into the
# oci-cost database each hour, see https://github.com/Laobei2012/oci-cost-collector.
# The chart creates one CronJob for each release.
#
# The collector logs in to OCI with the instance principal of the node. The
# CostReports policy of account A (terraform/modules/cluster/modules/grafana/iam.tf)
# applies only to the OKE nodes, and the policy of account B
# (terraform/modules/account-b/cost-reports.tf) only to the account B nodes.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: oci-cost-collector
spec:
  interval: 1h
  type: oci
  url: oci://ghcr.io/laobei2012/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: oci-cost-collector-account-a
spec:
  interval: 1h
  timeout: 5m
  chart:
    spec:
      chart: oci-cost-collector
      version: "0.3.0"
      sourceRef:
        kind: HelmRepository
        name: oci-cost-collector
      interval: 1h
  releaseName: oci-cost-collector-account-a
  values:
    tenancyId: ${oci_tenancy_id}
    account: a
    schedule: "17 * * * *"
    # The custom query in monitoring.yaml runs as this role.
    readRoles:
      - cnpg_metrics_exporter
    nodeSelector:
      name: k8s-cluster
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: oci-cost-collector-account-b
spec:
  interval: 1h
  timeout: 5m
  chart:
    spec:
      chart: oci-cost-collector
      version: "0.3.0"
      sourceRef:
        kind: HelmRepository
        name: oci-cost-collector
      interval: 1h
  releaseName: oci-cost-collector-account-b
  values:
    tenancyId: ${oci_tenancy_id_b}
    account: b
    schedule: "47 * * * *"
    readRoles:
      - cnpg_metrics_exporter
    nodeSelector:
      tenancy: account-b
