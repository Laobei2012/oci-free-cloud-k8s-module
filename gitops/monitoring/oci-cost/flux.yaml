apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: oci-cost
  namespace: flux-system
spec:
  interval: 1h
  timeout: 10m
  path: ./gitops/monitoring/oci-cost
  prune: true
  dependsOn:
    - name: cloudnative-pg
    - name: external-secrets
    - name: longhorn
    - name: kube-prometheus-stack
  sourceRef:
    kind: GitRepository
    name: platform
  # the module cluster (modules/grafana) writes oci_tenancy_id to this ConfigMap
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: oci-billing-exporter-vars
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: oci-cost
      namespace: oci-cost
