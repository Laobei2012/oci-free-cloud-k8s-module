# The password of the read-only grafana role. Terraform creates it in the
# vault, see terraform/modules/cluster/modules/grafana/oci_cost_db.tf.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oci-cost-grafana
spec:
  refreshInterval: 3m
  secretStoreRef:
    kind: ClusterSecretStore
    name: oracle-vault
  target:
    name: oci-cost-grafana
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: grafana
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: oci-cost-db-grafana
        version: CURRENT
