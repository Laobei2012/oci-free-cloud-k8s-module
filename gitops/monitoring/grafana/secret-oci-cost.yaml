# The password of the read-only grafana role in the oci-cost database, for the
# OCI Cost datasource. Terraform creates it in the vault, see
# terraform/modules/cluster/modules/grafana/oci_cost_db.tf.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oci-cost-db-grafana
  namespace: grafana
spec:
  refreshInterval: 3m
  secretStoreRef:
    kind: ClusterSecretStore
    name: oracle-vault
  target:
    name: oci-cost-db-grafana
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: password
      remoteRef:
        key: oci-cost-db-grafana
        version: CURRENT
