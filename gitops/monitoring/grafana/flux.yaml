apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana
  namespace: flux-system
spec:
  interval: 1h
  path: ./gitops/monitoring/grafana
  prune: true
  dependsOn:
    - name: cloudnative-pg
    - name: external-secrets
    - name: envoy-gateway
    - name: longhorn
  sourceRef:
    kind: GitRepository
    name: platform
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
