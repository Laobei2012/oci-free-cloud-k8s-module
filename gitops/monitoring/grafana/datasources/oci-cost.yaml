apiVersion: 1
datasources:
  - name: OCI Cost
    type: grafana-postgresql-datasource
    uid: oci-cost
    access: proxy
    url: oci-cost-rw.oci-cost.svc.cluster.local:5432
    user: grafana
    jsonData:
      database: oci_cost
      sslmode: require
      postgresVersion: 1500
    secureJsonData:
      password: ${OCI_COST_DB_PASSWORD}
