apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack
spec:
  interval: 1h
  path: ./gitops/monitoring/kube-prometheus-stack
  prune: true
  dependsOn:
    - name: external-secrets
    - name: cert-manager
    - name: longhorn
  sourceRef:
    kind: GitRepository
    name: platform
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
